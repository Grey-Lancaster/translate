; Code by Grey and my buddy Claude AI
;
; Target: Freenove Media Kit for ESP32-S3 (FNK0102)
; Board id below is the generic esp32-s3-devkitc-1 def as a starting point --
; swap for Freenove's exact flash/PSRAM config once confirmed (see include/pins.h TODOs).

[env:freenove_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ 8.3.11
    https://github.com/Grey-Lancaster/TouchWifiProvisioner.git
