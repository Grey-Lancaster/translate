; Code by Grey and my buddy Claude AI
;
; Target: Freenove Media Kit for ESP32-S3 (FNK0102)
; Board id below is the generic esp32-s3-devkitc-1 def as a starting point --
; swap for Freenove's exact flash/PSRAM config once confirmed (see include/pins.h TODOs).

[env:freenove_esp32s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -Iinclude
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    ; --- TFT_eSPI panel config (User_Setup.h replacement via build flags) ---
    ; TODO: driver/pins are placeholders copied from the generic CYD reference
    ; wiring -- confirm against the actual Freenove board, see include/pins.h
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ 8.3.11
    paulstoffregen/XPT2046_Touchscreen
    https://github.com/Grey-Lancaster/TouchWifiProvisioner.git
