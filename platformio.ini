; Code by Grey and my buddy Claude AI
;
; Target: Freenove FNK0104B -- "Freenove ESP32-S3 Display", 2.8" ILI9341
; 240x320 with FT6336U capacitive touch (confirmed via board photo + repo
; research 2026-08-22; this is a DIFFERENT product than the FNK0102 Media
; Kit originally assumed -- see memory for the full mixup history).
; ESP32-S3-WROOM-1 N16R8 (16MB flash, 8MB octal PSRAM) -- board def in
; boards/ reused from Grey-Lancaster/Claude_usage, since the generic
; esp32-s3-devkitc-1 def defaults to "No PSRAM" and crashes (Guru
; Meditation StoreProhibited) on boot when PSRAM is forced on via a plain
; build flag instead of a matching board def.
;
; Display + touch pins sourced directly from Freenove's own shipped config
; (Freenove_ESP32_S3_Display repo, Libraries/FNK0104AB/TFT_eSPI_Setups_v1.3.zip
; -> FNK0104AB_2.8_240x320_ILI9341.h, and Sketch_11.1_Touch.ino), not guessed.

[env:freenove_esp32s3]
platform = espressif32@6.10.0
; Tried bumping to 6.13.0 hoping for a newer Arduino-ESP32 core with
; ESP_I2S.h (recordWAV/playWAV) -- both versions resolve to the same cached
; framework-arduinoespressif32@3.20017.241212, which predates that API.
; Reverted to the known-good pin rather than chase a framework version that
; isn't actually reachable this way; using the older bundled I2S.h library
; instead (see src/main.cpp).
board = ESP32-S3-WROOM-1-N16R8
framework = arduino
monitor_speed = 115200
build_flags =
    -Iinclude
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    ; --- TFT_eSPI panel config, transcribed line-for-line from Freenove's
    ; actual shipped FNK0104AB_2.8_240x320_ILI9341.h -- EXCEPT USE_HSPI_PORT,
    ; deliberately left OFF. Freenove's own header sets it, but on TFT_eSPI
    ; ESP32-S3 that macro maps to an invalid SPI host (SPI_PORT 3 -- only
    ; SPI2_HOST=1 and SPI3_HOST=2 exist on S3, SPI1_HOST=0 is flash-only) --
    ; a known open upstream bug (Bodmer/TFT_eSPI#3743) causing exactly the
    ; StoreProhibited crash we hit in tft.begin(). The DEFAULT (non-HSPI)
    ; ESP32-S3 path was ALSO broken in the tagged V2.5.43 release (used
    ; "FSPI" instead of a valid host number) -- fixed on TFT_eSPI's master
    ; branch (commit 83d4d16, "Fix ... ESP32S3 ... board packages 3.x.x")
    ; but never back-ported to a new tagged release, hence lib_deps below
    ; pins directly to master instead of the registry version.
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    ; --- Fonts (Section 3 of Freenove's header) -- without at least one of
    ; these, TFT_eSPI compiles in no glyph data at all and tft.print() draws
    ; nothing (silently) even though fillScreen() and other primitives work.
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; --- FT6336U capacitive touch (I2C), for the next step after text-on-screen ---
    -DTOUCH_SDA=16
    -DTOUCH_SCL=15
    -DTOUCH_RST=18
    -DTOUCH_INT=17
lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git
    lvgl/lvgl @ 8.3.11
    https://github.com/Grey-Lancaster/TouchWifiProvisioner.git
    bblanchon/ArduinoJson @ ^7.0.0
